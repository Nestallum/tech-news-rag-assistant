name: Daily ingestion

on:
  schedule:
    - cron: "0 6 * * *"   # 6h UTC every day
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ingestion
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: uv run python scripts/ingest.py

      - name: Record last run
        run: |
          mkdir -p .github/status
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/status/last-ingest.txt

      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/status/last-ingest.txt
          git diff --staged --quiet || git commit -m "chore: ingestion heartbeat"
          git push
