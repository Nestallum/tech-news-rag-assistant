<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech News RAG Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
        rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--
        State is driven by the `data-state` attribute on .app:
          "empty" -> home screen: title, composer, and suggestions are stacked
                     and centred; the thread is hidden.
          "chat"  -> the thread fills the view and the composer is docked at
                     the bottom.

        On the first submission the composer slides from its centred home
        position down to the dock (FLIP technique). The thread then scrolls
        beneath the dock; a mask sized from --composer-h dissolves content at
        the top and bottom so there is no hard clip line. The custom overlay
        scrollbar lives outside the masked thread, so it stays crisp.
    -->
    <div class="app" id="app" data-state="empty">

        <header class="topbar">
            <button class="brand" id="brand" type="button" aria-label="Start a new conversation">
                Tech News <span class="brand-sub">RAG Assistant</span>
            </button>
        </header>

        <main
            class="thread"
            id="thread"
            role="log"
            aria-live="polite"
            aria-label="Conversation">
            <div class="thread-inner" id="threadInner">
                <!-- Messages are appended here by script.js -->
            </div>
        </main>

        <!--
            Custom overlay scrollbar. It lives outside .thread (which carries
            the dissolve mask), so it stays crisp from top to bottom while the
            content still fades at both edges. JS keeps the thumb in sync with
            the thread's scroll position.
        -->
        <div class="scrollbar" id="scrollbar" aria-hidden="true">
            <div class="scrollbar-thumb" id="scrollbarThumb"></div>
        </div>

        <div class="dock" id="dock">
            <div class="dock-center" id="dockCenter">

                <section class="welcome" id="welcome">
                    <h1 class="welcome-title">Caught up on tech news?</h1>
                </section>

                <div class="composer-positioner" id="composerPositioner">
                    <div class="composer" id="composer">
                        <textarea
                            id="input"
                            class="composer-input"
                            placeholder="Ask something about latest tech news..."
                            rows="1"
                            maxlength="2000"
                            aria-label="Ask a question"></textarea>

                        <div class="composer-actions">
                            <button
                                id="send"
                                class="send-button"
                                type="button"
                                aria-label="Send question">
                                <span class="material-symbols-rounded">arrow_upward</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="suggestions" id="suggestions">
                    <button class="chip" type="button">What's new with Apple?</button>
                    <button class="chip" type="button">Any recent AI funding rounds?</button>
                    <button class="chip" type="button">Latest news on OpenAI?</button>
                </div>

            </div>

            <p class="disclaimer">
                AI can make mistakes. Please verify important information.
            </p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
